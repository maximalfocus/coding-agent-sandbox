services:
  claude-sandbox:
    build:
      context: .
    image: coding-agent-sandbox:latest
    container_name: claude-sandbox
    # Least privilege: drop the WHOLE default capability set, then add back only the five caps
    # this sandbox actually exercises. The article's recurring lesson is to lean on battle-tested
    # primitives and minimize your own surface — a dropped cap is one the agent can't abuse even
    # after a compromise. NET_RAW, SYS_ADMIN, MKNOD, etc. are all gone with ALL.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN     # entrypoint installs the iptables egress firewall
      - SETUID        # gosu drops root->node; tinyproxy drops root->tinyproxy
      - SETGID        # ditto (setgroups/setgid on privilege drop)
      - CHOWN         # entrypoint owns the config volume for the node user
      - DAC_OVERRIDE  # tinyproxy (root) writes its pid/log into tinyproxy-owned dirs at startup
      # (KILL dropped — allow-domain.sh now signals tinyproxy as the tinyproxy user, not root.)
    # Block privilege escalation via setuid binaries (Claude runs as the unprivileged `node`).
    security_opt:
      - "no-new-privileges:true"
    # Kernel-escape resistance (optional). Docker shares the host kernel, so this is defense-in-
    # depth, not a VM boundary (see SECURITY.md). If you've installed gVisor, uncomment to run the
    # container under the runsc sandbox — a user-space kernel that intercepts syscalls — which is
    # the same class of primitive the containment write-up uses for claude.ai. No other change
    # needed; everything below still applies.
    # runtime: runsc
    # Cap blast radius of a runaway build/agent so it can't exhaust the host.
    mem_limit: "${MEM_LIMIT:-6g}"
    pids_limit: ${PIDS_LIMIT:-4096}
    # Web terminal, bound to localhost only — never exposed to your LAN.
    ports:
      - "127.0.0.1:${TTYD_PORT:-7681}:7681"
      # (Codex sign-in uses the device-auth flow — no localhost callback port needed.)
    environment:
      TTYD_USER: "${TTYD_USER:-coder}"
      TTYD_PASS: "${TTYD_PASS:-changeme}"
      # Browser terminal layout: 2x2 (default, four tiled panes) or 1 (single pane).
      TTYD_GRID: "${TTYD_GRID:-2x2}"
      EXTRA_ALLOWED_DOMAINS: "${EXTRA_ALLOWED_DOMAINS:-}"
      # GitHub egress is a capability grant (read payloads in / push data out). On by default;
      # set ALLOW_GITHUB=false in .env for analysis-only or untrusted-workspace runs.
      ALLOW_GITHUB: "${ALLOW_GITHUB:-true}"
      # OpenAI/Codex egress (api/auth.openai.com + chatgpt.com) for cross-vendor peer review.
      # Off by default; set true in .env to use the bundled Codex CLI (./codex-login.sh).
      ALLOW_OPENAI: "${ALLOW_OPENAI:-false}"
      # GitHub over HTTPS (SSH/22 is blocked). Set GITHUB_TOKEN in .env to a PAT for full
      # clone/pull/push; SSH github remotes are auto-rewritten to HTTPS. Needs ALLOW_GITHUB=true.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GIT_USER_NAME: "${GIT_USER_NAME:-}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:-}"
      # peerreview self-evolves + pushes peerreview-skills every run. Set PEERREVIEW_EVOLVE=off on
      # environments that should NOT be the evolver (so only one place pushes — avoids git races).
      # Unset (default) = this environment evolves. See skills-setup / SECURITY notes.
      PEERREVIEW_EVOLVE: "${PEERREVIEW_EVOLVE:-}"
      # Audit-log rotation (the local egress trail in the claude-audit volume). Defaults keep
      # ~100 MiB max; tune if you want a longer or shorter local history.
      AUDIT_LOG_MAX_BYTES: "${AUDIT_LOG_MAX_BYTES:-20971520}"
      AUDIT_LOG_KEEP: "${AUDIT_LOG_KEEP:-5}"
      AUDIT_ROTATE_INTERVAL: "${AUDIT_ROTATE_INTERVAL:-3600}"
      # (Proxy env, CLAUDE_CONFIG_DIR and telemetry-off are baked into the image so every
      #  launch — compose, exec, or the claude-safe `docker run` — inherits them.)
    volumes:
      # The host files Claude can see or edit. /workspace is the root; PERSONAL_DIR and WORK_DIR
      # (set in .env, guarded by run.sh/run.ps1) mount your personal projects and your work /
      # enterprise projects at /workspace/personal and /workspace/work so you can work across both in
      # one session. Bigger mount = bigger blast radius, and mounted code is sent to Anthropic —
      # see SECURITY.md. (PERSONAL_DIR/WORK_DIR were formerly WS_DIR/PROJECTS_DIR.)
      - "${WORKSPACE_DIR:-./workspace}:/workspace"
      - "${PERSONAL_DIR:-./workspace/personal}:/workspace/personal"
      - "${WORK_DIR:-./workspace/work}:/workspace/work"
      # Persists the subscription login + Claude settings across restarts.
      - "claude-config:/home/node/.claude"
      # Persists the Codex subscription login (~/.codex/auth.json) across restarts.
      - "claude-codex:/home/node/.codex"
      # Persists the GitHub CLI login (~/.config/gh) across restarts — gh's token carries the
      # `workflow` scope, so pushes incl. .github/workflows/* work. One-time ./gh-login.sh.
      - "claude-gh:/home/node/.config/gh"
      # ~/ws — the skills/notes HOME. skills-setup clones your skill repos here and the *-evolve
      # skills + /note hardcode ~/ws paths, so this in-container name stays "ws" even though the
      # user-facing mount is /workspace/personal. If PERSONAL_DIR is set (in .env), the SAME host
      # tree is mounted here AND at /workspace/personal — one source of truth (host == sandbox
      # clones, one evolver). Unset -> isolated named volume (skills-setup clones into it).
      - "${PERSONAL_DIR:-claude-ws}:/home/node/ws"
      # The work tree mirrored to home (same host dir as /workspace/work) - live two-way.
      - "${WORK_DIR:-./workspace/work}:/home/node/work"
      # Audit trail: every host the proxy was asked to reach (allowed + refused).
      - "claude-audit:/var/log/tinyproxy"
    restart: unless-stopped

volumes:
  # Explicit, project-name-independent names so renaming the folder never orphans your login.
  claude-config:
    name: coding-agent-sandbox-config
  claude-codex:
    name: coding-agent-sandbox-codex
  claude-gh:
    name: coding-agent-sandbox-gh
  claude-ws:
    name: coding-agent-sandbox-ws
  claude-audit:
    name: coding-agent-sandbox-audit
