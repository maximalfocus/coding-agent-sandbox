# Hostname-filtering forward proxy for the Claude Code sandbox.
# Default-deny: only hosts matching /etc/tinyproxy/filter (generated at startup from your
# domain allowlist) are permitted. Filtering is by DOMAIN NAME, not IP.
User tinyproxy
Group tinyproxy

Port 8888
Listen 127.0.0.1
Timeout 600

# Only the local container may use the proxy.
Allow 127.0.0.1

ViaProxyName "claude-sandbox"

# Allow HTTPS CONNECT only to the standard TLS port (443). (NNTPS/563 intentionally omitted.)
ConnectPort 443

# The allowlist. FilterDefaultDeny = block everything not matched.
FilterExtended On
FilterCaseSensitive Off
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"

LogLevel Info
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
